name: 14-run-composite-action.yml
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Name of the person to greet'
        required: true
        default: 'Unnamed'

jobs:
  composite-action:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Composite Action
      uses: ./
      with:
        name: ${{ github.event.inputs.name }}

    - name: Print message from Composite Action
      run: |
        echo "Message from composite action: ${{ steps.greeting.outputs.message }}"