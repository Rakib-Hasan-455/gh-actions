name: 11-script-workflow.yml
on:
  workflow_dispatch:

jobs:
  script-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Script Workflow
        run: |
          echo "Running script workflow"

      - name: Run Python Script
        run: python script.py

      - name: Test Secret Access
        run: |
            if [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
             echo "Success: The secret is accessible and contains a value!"
             else
            echo "Fail: The secret is empty or not found."
            exit 1
            fi