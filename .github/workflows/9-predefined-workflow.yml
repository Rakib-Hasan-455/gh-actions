name: Predefined Workflow
on:
  workflow_dispatch:


jobs:
  predefined-workflow-job:
    runs-on: ubuntu-latest
    # there's many types of runner, shared, self-hosted, and composite

    steps:
      - name: NodeJs Version
        run: node -v

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: NodeJs Version Check
        run: node -v